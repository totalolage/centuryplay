name: Android CI and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set build version
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_code=3
          base_name=1.0
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            source_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            echo "APP_VERSION_NAME=${base_name}+${source_sha:0:7}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$base_code" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "APP_VERSION_NAME=${base_name}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$((base_code + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_NAME=$base_name" >> "$GITHUB_ENV"
            echo "APP_VERSION_CODE=$base_code" >> "$GITHUB_ENV"
          fi

      - name: Build debug and unsigned release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: centuryplay-apks-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    name: Publish signed release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    env:
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      RELEASE_TAG: v1.0.${{ github.run_number }}
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set build version
        run: |
          echo "APP_VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((3 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing environment variable ANDROID_KEY_ALIAS"; exit 1; }

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/centuryplay-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: centuryplay-release-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          retention-days: 90
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          asset="centuryplay-${RELEASE_TAG}.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk#$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$apk#$asset" \
              --target "$GITHUB_SHA" \
              --title "CenturyPlay $RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
